[project]
name = "legal-copilot-clause-ner"
version = "0.1.0"
description = "Dev 3 — Clause NER + Knowledge Graph stage of the Legal Intelligence Copilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # /ingest/upload is a multipart form; FastAPI raises at route-definition time
    # without it, which would break importing app.api at all.
    "python-multipart>=0.0.9",
    # Supabase access-token verification (app/auth/jwt.py). The [crypto] extra pulls in
    # `cryptography`, which RS256/ES256 need — without it JWKS verification raises at
    # first request rather than at import, so a missing extra looks like an auth bug.
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
live = ["anthropic>=0.34"]
# UniversalOCREngine's backend. Imported lazily inside run(), so the package stays
# importable without it — but /ingest/upload needs it at runtime. markitdown handles
# DOCX/PPTX/XLSX/HTML; pymupdf4llm extracts PDF text as markdown natively (faster than
# markitdown's pdfminer path, and pulls in pymupdf itself). Images and scanned PDF pages
# still go through Codex vision — see `live` extra / ANTHROPIC_API_KEY.
ocr = ["markitdown", "pymupdf4llm", "Pillow"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

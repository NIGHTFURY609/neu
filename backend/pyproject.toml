[project]
name = "legal-copilot-clause-ner"
version = "0.1.0"
description = "Dev 3 — Clause NER + Knowledge Graph stage of the Legal Intelligence Copilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # /ingest/upload is a multipart form; FastAPI raises at route-definition time
    # without it, which would break importing app.api at all.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
live = ["anthropic>=0.34"]
# UniversalOCREngine's backend. Imported lazily inside run(), so the package stays
# importable without it — but /ingest/upload needs it at runtime.
ocr = ["markitdown"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

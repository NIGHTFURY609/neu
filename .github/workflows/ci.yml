name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run pytest
        working-directory: backend
        # No DATABASE_URL is set: app/db.py's wait_for_database absorbs the unreachable
        # default, and tests/test_db_integration.py skips its live-schema check rather
        # than failing, so the suite is meaningful without a live Postgres here.
        run: pytest --basetemp .pytest-tmp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
